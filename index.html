
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <title>R7 Zenty | Yayın Arşivi</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101014;
      --panel: #19191f;
      --text: #f5f5f7;
      --muted: #a5a5b2;
      --accent: #53fc18;
      --border: #303039;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 26px 18px;
      background: #17171d;
      border-bottom: 1px solid var(--border);
    }

    .header-inner, main {
      width: min(1100px, 100%);
      margin: auto;
    }

    .brand {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .brand span { color: var(--accent); }

    .subtitle {
      color: var(--muted);
      margin-top: 8px;
      font-size: 14px;
    }

    main { padding: 24px 16px 50px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 17px;
      min-width: 0;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: clamp(17px, 3vw, 25px);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .section-title {
      font-size: 22px;
      margin: 0 0 16px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .toolbar input {
      flex: 1;
      min-width: 0;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px;
      font-size: 14px;
    }

    button, .watch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 8px;
      padding: 11px 15px;
      background: var(--accent);
      color: #101014;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    .vod-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .vod {
      min-width: 0;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      object-fit: cover;
      background: #25252d;
    }

    .no-thumb {
      aspect-ratio: 16 / 9;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: #25252d;
    }

    .vod-body { padding: 14px; }

    .vod-title {
      margin: 0 0 12px;
      font-size: 16px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.9;
      margin-bottom: 14px;
    }

    .vod-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      padding: 18px 0;
    }

    .error { color: #ff8585; }

    footer {
      padding: 24px 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 800px) {
      .vod-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      .stats { gap: 8px; }
      .stat { padding: 12px 10px; }
      .stat-label { font-size: 11px; }
      .vod-grid { grid-template-columns: 1fr; }
      .brand { font-size: 23px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="brand">R7 <span>ZENTY</span></div>
      <div class="subtitle">Yayın arşivi ve istatistikler</div>
    </div>
  </header>

  <main>
    <section class="stats">
      <div class="stat">
        <div class="stat-label">Toplam VOD</div>
        <div class="stat-value" id="totalVods">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Toplam izlenme</div>
        <div class="stat-value" id="totalViews">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Toplam yayın süresi</div>
        <div class="stat-value" id="totalDuration">—</div>
      </div>
    </section>

    <section>
      <h1 class="section-title">Yayın kayıtları</h1>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Yayın ara..." aria-label="Yayın ara">
        <button id="refresh" type="button">Yenile</button>
      </div>
      <div id="message" class="status">Yayınlar yükleniyor...</div>
      <div id="vodGrid" class="vod-grid"></div>
    </section>
  </main>

  <footer>
    R7 Zenty · Yayın arşivi
  </footer>

  <script>
    const CHANNEL = "r7-zenty";
    const grid = document.getElementById("vodGrid");
    const message = document.getElementById("message");
    const search = document.getElementById("search");

    let allVods = [];

    const numberFormat = value =>
      new Intl.NumberFormat("tr-TR").format(value);

    // JSON saniye veya milisaniye içeriyorsa süreyi makul biçimde dönüştür.
    function durationSeconds(value) {
      let n = Number(value);
      if (!Number.isFinite(n) || n < 0) return null;

      // Çok büyük değerler milisaniye olabilir.
      if (n > 7 * 24 * 60 * 60) n = n / 1000;

      return Math.floor(n);
    }

    function formatDuration(value) {
      const seconds = durationSeconds(value);
      if (seconds === null) return "Süre bilgisi yok";

      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);

      if (h > 0) return `${h} sa ${m} dk`;
      return `${m} dk`;
    }

    function getVodUrl(vod) {
      if (vod.url && /^https:\/\/kick\.com\//i.test(vod.url)) {
        return vod.url;
      }

      if (vod.id) {
        return `https://kick.com/${CHANNEL}/videos/${encodeURIComponent(vod.id)}`;
      }

      return `https://kick.com/${CHANNEL}`;
    }

    function safeText(value, fallback) {
      if (value === null || value === undefined || value === "") {
        return fallback;
      }
      return String(value);
    }

    function render() {
      const query = search.value.trim().toLocaleLowerCase("tr-TR");

      const vods = allVods.filter(v => {
        const text = [
          v.title, v.category, v.created_at
        ].filter(Boolean).join(" ").toLocaleLowerCase("tr-TR");

        return text.includes(query);
      });

      grid.replaceChildren();

      if (!vods.length) {
        message.textContent = allVods.length
          ? "Aramana uygun yayın bulunamadı."
          : "Henüz yayın kaydı yok.";
        message.className = "status";
        return;
      }

      message.textContent = `${vods.length} yayın gösteriliyor.`;
      message.className = "status";

      for (const vod of vods) {
        const card = document.createElement("article");
        card.className = "vod";

        if (vod.thumbnail && /^https:\/\//i.test(vod.thumbnail)) {
          const img = document.createElement("img");
          img.className = "thumb";
          img.src = vod.thumbnail;
          img.alt = safeText(vod.title, "Yayın kapağı");
          img.loading = "lazy";
          img.onerror = () => {
            const placeholder = document.createElement("div");
            placeholder.className = "no-thumb";
            placeholder.textContent = "Kapak bulunamadı";
            img.replaceWith(placeholder);
          };
          card.appendChild(img);
        } else {
          const placeholder = document.createElement("div");
          placeholder.className = "no-thumb";
          placeholder.textContent = "Yayın kaydı";
          card.appendChild(placeholder);
        }

        const body = document.createElement("div");
        body.className = "vod-body";

        const title = document.createElement("h2");
        title.className = "vod-title";
        title.textContent = safeText(vod.title, "Başlıksız yayın");

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent =
          `Tarih: ${safeText(vod.created_at, "Bilinmiyor")}\n` +
          `Süre: ${formatDuration(vod.duration)}\n` +
          `Kategori: ${safeText(vod.category, "Belirtilmemiş")}\n` +
          `İzlenme: ${
            vod.views === null || vod.views === undefined || vod.views === ""
              ? "Bilinmiyor"
              : numberFormat(Number(vod.views) || 0)
          }`;
        meta.style.whiteSpace = "pre-line";

        const footer = document.createElement("div");
        footer.className = "vod-footer";

        const link = document.createElement("a");
        link.className = "watch";
        link.href = getVodUrl(vod);
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "İzle";

        footer.appendChild(link);
        body.append(title, meta, footer);
        card.appendChild(body);
        grid.appendChild(card);
      }
    }

    async function loadVods() {
      message.textContent = "Yayınlar yükleniyor...";
      message.className = "status";

      try {
        const response = await fetch(`vods.json?t=${Date.now()}`, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`vods.json yüklenemedi (${response.status})`);
        }

        const data = await response.json();
        const list = Array.isArray(data) ? data : data.vods;

        if (!Array.isArray(list)) {
          throw new Error("vods.json içinde vods listesi bulunamadı.");
        }

        allVods = list.filter(v => v && typeof v === "object");

        document.getElementById("totalVods").textContent =
          numberFormat(allVods.length);

        const totalViews = allVods.reduce((sum, v) => {
          const n = Number(v.views);
          return sum + (Number.isFinite(n) && n >= 0 ? n : 0);
        }, 0);

        document.getElementById("totalViews").textContent =
          numberFormat(totalViews);

        const totalSeconds = allVods.reduce((sum, v) => {
          return sum + (durationSeconds(v.duration) || 0);
        }, 0);

        document.getElementById("totalDuration").textContent =
          formatDuration(totalSeconds);

        render();
      } catch (error) {
        message.textContent =
          "Yayınlar yüklenemedi. vods.json dosyasını ve JSON biçimini kontrol et. " +
          error.message;
        message.className = "status error";
      }
    }

    search.addEventListener("input", render);
    document.getElementById("refresh").addEventListener("click", loadVods);

    loadVods();
  </script>
</body>
</html>
